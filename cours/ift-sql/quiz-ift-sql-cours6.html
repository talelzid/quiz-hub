<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Quiz - Gestion du temps et des priorités</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="global-course-title">Initiation à la fonction de travail d'un spécialiste en qualité logicielle</div>
    <h1>Quiz : Gestion du temps et des priorités (Cours 6)</h1>

    <div class="progress-container">
        <div class="progress-info">
            <span id="question-counter">Question 1 / 10</span>
            <div class="progress-stats">
                <span class="stat-badge incorrect"><span class="stat-icon">✕</span><span id="incorrect-count">0</span></span>
                <span class="stat-badge correct"><span class="stat-icon">✓</span><span id="correct-count">0</span></span>
            </div>
        </div>
        <div class="progress-bar-wrapper" id="progressBar"></div>
    </div>

    <div id="quiz-container" class="card"></div>

    <div id="feedback" class="feedback-container"></div>

    <div class="quiz-navigation">
        <button id="prevBtn" onclick="previousQuestion()">← Précédent</button>
        <button id="nextBtn" onclick="nextQuestion()">Suivant →</button>
    </div>

    <div id="result"></div>

    <script>
        const questions = [
    {
        "q": "Quelle loi affirme qu'un travail interrompu prend plus de temps qu'un travail continu ?",
        "options": [
            {
                "text": "La loi de Parkinson",
                "explain": "Faux. Parkinson dit que le travail s'étend pour remplir le temps disponible."
            },
            {
                "text": "La loi de Carlson",
                "explain": "Correct. Sune Carlson a montré qu'un travail continu est plus efficace : chaque interruption ajoute un temps de reprise."
            },
            {
                "text": "La loi de Fraisse",
                "explain": "Faux. Fraisse porte sur la perception du temps selon qu'une tâche nous plaît ou non."
            },
            {
                "text": "Le principe de Pareto",
                "explain": "Faux. Pareto dit que 20 % des efforts produisent 80 % des résultats."
            }
        ],
        "correct": 1,
        "correctExplain": "Correct. Sune Carlson a montré qu'un travail continu est plus efficace : chaque interruption ajoute un temps de reprise."
    },
    {
        "q": "Que signifie la lettre M de la méthode TEMPS ?",
        "options": [
            {
                "text": "Mesurer le temps passé",
                "explain": "Faux. La mesure du temps passé relève de la feuille de temps, pas de la lettre M."
            },
            {
                "text": "Multiplier les tâches",
                "explain": "Faux. C'est plutôt l'inverse que le cours recommande."
            },
            {
                "text": "Ménager une marge pour les imprévus",
                "explain": "Correct. On garde environ 40 % du temps pour les imprévus et les interruptions."
            },
            {
                "text": "Mettre à jour Jira",
                "explain": "Faux. C'est une tâche, pas une étape de la méthode."
            }
        ],
        "correct": 2,
        "correctExplain": "Correct. On garde environ 40 % du temps pour les imprévus et les interruptions."
    },
    {
        "q": "Dans la matrice d'Eisenhower, que fait-on d'une tâche importante mais pas urgente ?",
        "options": [
            {
                "text": "On la planifie",
                "explain": "Correct. On lui réserve un moment dans l'agenda ; c'est le quadrant qui fait progresser."
            },
            {
                "text": "On la fait immédiatement",
                "explain": "Faux. « Faire » concerne les tâches à la fois urgentes et importantes."
            },
            {
                "text": "On la délègue",
                "explain": "Faux. « Déléguer » concerne les tâches urgentes mais peu importantes."
            },
            {
                "text": "On l'élimine",
                "explain": "Faux. Elle est importante : l'éliminer serait une erreur."
            }
        ],
        "correct": 0,
        "correctExplain": "Correct. On lui réserve un moment dans l'agenda ; c'est le quadrant qui fait progresser."
    },
    {
        "q": "Une réunion prévue pour une heure dure une heure, alors que tout était réglé en 20 minutes. Quelle loi l'illustre ?",
        "options": [
            {
                "text": "La loi de Murphy",
                "explain": "Faux. Murphy dit que tout prend plus de temps que prévu à cause des imprévus. Ici, aucun imprévu : le temps disponible a été rempli."
            },
            {
                "text": "La loi de Carlson",
                "explain": "Faux. Il n'est pas question d'interruptions."
            },
            {
                "text": "La loi du rythme biologique",
                "explain": "Faux. Elle porte sur la variation de l'énergie au cours de la journée."
            },
            {
                "text": "La loi de Parkinson",
                "explain": "Correct. Le travail s'étend pour occuper tout le temps alloué."
            }
        ],
        "correct": 3,
        "correctExplain": "Correct. Le travail s'étend pour occuper tout le temps alloué."
    },
    {
        "q": "Avec l'estimation à trois points, quelle est l'estimation d'une tâche avec O = 2 h, P = 4 h et Pe = 9 h ?",
        "options": [
            {
                "text": "4 h",
                "explain": "Faux. 4 h est la valeur probable seule ; la formule tient aussi compte des extrêmes."
            },
            {
                "text": "4,5 h",
                "explain": "Correct. (2 + 4 × 4 + 9) ÷ 6 = 27 ÷ 6 = 4,5 h."
            },
            {
                "text": "5 h",
                "explain": "Faux. C'est la moyenne simple (2 + 4 + 9) ÷ 3, qui ne donne pas plus de poids au cas probable."
            },
            {
                "text": "15 h",
                "explain": "Faux. C'est la somme des trois valeurs, pas une estimation."
            }
        ],
        "correct": 1,
        "correctExplain": "Correct. (2 + 4 × 4 + 9) ÷ 6 = 27 ÷ 6 = 4,5 h."
    },
    {
        "q": "Combien de comparaisons faut-il pour une matrice préférentielle de 7 tâches ?",
        "options": [
            {
                "text": "7",
                "explain": "Faux. Chaque tâche est comparée à toutes les autres, pas une seule fois."
            },
            {
                "text": "14",
                "explain": "Faux. Ce serait deux comparaisons par tâche."
            },
            {
                "text": "21",
                "explain": "Correct. n × (n − 1) ÷ 2 = 7 × 6 ÷ 2 = 21 duels."
            },
            {
                "text": "49",
                "explain": "Faux. Ce serait 7 × 7, en comparant chaque tâche à elle-même et chaque paire deux fois."
            }
        ],
        "correct": 2,
        "correctExplain": "Correct. n × (n − 1) ÷ 2 = 7 × 6 ÷ 2 = 21 duels."
    },
    {
        "q": "Selon la règle des 60/40, sur une journée de 7,5 heures, combien d'heures environ devriez-vous planifier ?",
        "options": [
            {
                "text": "7,5 h",
                "explain": "Faux. Une journée planifiée à 100 % est en retard dès la première interruption."
            },
            {
                "text": "6 h",
                "explain": "Faux. C'est 80 % : il ne resterait pas assez de marge."
            },
            {
                "text": "3 h",
                "explain": "Faux. C'est 40 % : trop peu planifié."
            },
            {
                "text": "4,5 h",
                "explain": "Correct. 60 % de 7,5 h, soit environ 4,5 h ; le reste absorbe les imprévus, les interruptions et les échanges."
            }
        ],
        "correct": 3,
        "correctExplain": "Correct. 60 % de 7,5 h, soit environ 4,5 h ; le reste absorbe les imprévus, les interruptions et les échanges."
    },
    {
        "q": "Jeudi, vous devez rédiger des cas de test complexes et classer des captures d'écran. Selon la loi du rythme biologique, quel est le meilleur plan ?",
        "options": [
            {
                "text": "Les cas complexes le matin, les captures après le dîner",
                "explain": "Correct. On place la tâche exigeante quand la concentration est souvent meilleure, et la tâche simple dans le creux d'après-midi."
            },
            {
                "text": "Les captures le matin pour « se mettre en train », les cas en fin de journée",
                "explain": "Faux. Vous gaspilleriez votre meilleur moment sur une tâche simple, et feriez la tâche exigeante fatigué."
            },
            {
                "text": "Les deux en même temps pour gagner du temps",
                "explain": "Faux. Mener deux tâches de front multiplie les changements de contexte (loi de Carlson)."
            },
            {
                "text": "Peu importe : l'énergie est la même toute la journée",
                "explain": "Faux. C'est justement ce que la loi du rythme biologique contredit."
            }
        ],
        "correct": 0,
        "correctExplain": "Correct. On place la tâche exigeante quand la concentration est souvent meilleure, et la tâche simple dans le creux d'après-midi."
    },
    {
        "q": "Le calendrier montre que, la semaine de la mise en production, le QA senior est en vacances, une développeuse part en congé parental le mercredi et le Product Owner est absent le jour de la sortie. Quelle est la réaction la plus professionnelle ?",
        "options": [
            {
                "text": "Ne rien dire : la date a été fixée par la direction",
                "explain": "Faux. Le contexte organisationnel fait partie de la planification : un risque connu doit être signalé."
            },
            {
                "text": "Annuler la mise en production de votre propre chef",
                "explain": "Faux. Vous n'avez pas ce pouvoir ; votre rôle est d'informer et de proposer."
            },
            {
                "text": "Prévenir la Scrum Master et proposer des options : avancer la date, prévoir une relève, faire valider plus tôt par le Product Owner",
                "explain": "Correct. Vous rendez le risque visible et vous proposez des solutions, sans décider seul."
            },
            {
                "text": "Prévoir de travailler seul toute la semaine pour compenser",
                "explain": "Faux. Cela ne règle ni l'absence de validation du Product Owner ni le risque de surcharge."
            }
        ],
        "correct": 2,
        "correctExplain": "Correct. Vous rendez le risque visible et vous proposez des solutions, sans décider seul."
    },
    {
        "q": "Votre feuille de temps montre 5,5 h d'attente et de pannes sur 37,5 h, et 10,5 h sur le paiement au lieu des 20 h prévues. Quelle conclusion est la plus utile pour le prochain sprint ?",
        "options": [
            {
                "text": "Les feuilles de temps ne servent qu'à la paie : aucune conclusion à tirer",
                "explain": "Faux. Le cours présente la feuille de temps comme un outil pour suivre, comparer le prévu et le réel et mieux estimer."
            },
            {
                "text": "Il faut travailler le soir pour rattraper le retard",
                "explain": "Faux. Ce n'est pas une analyse : cela augmente le stress sans traiter la cause."
            },
            {
                "text": "L'estimation du paiement était fausse et il faut la doubler",
                "explain": "Faux. L'écart vient surtout des attentes et des pannes, pas d'une mauvaise estimation du travail lui-même."
            },
            {
                "text": "Environ 15 % du temps a été perdu en attentes : prévoir une marge et un plan B pour les dépendances (environnement, passerelle)",
                "explain": "Correct. La feuille de temps révèle la cause de l'écart, ce qui permet d'ajuster la planification du prochain sprint."
            }
        ],
        "correct": 3,
        "correctExplain": "Correct. La feuille de temps révèle la cause de l'écart, ce qui permet d'ajuster la planification du prochain sprint."
    }
];
        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let answered = new Array(questions.length).fill(false);

        function displayQuestion() {
            const container = document.getElementById('quiz-container');
            const item = questions[currentQuestion];

            let html = `<div class="question">${currentQuestion + 1}. ${item.q}</div>`;
            const letters = ['A', 'B', 'C', 'D'];
            item.options.forEach((opt, i) => {
                let classes = '';
                if (answers[currentQuestion] === i) {
                    classes = 'selected ';
                    if (i === item.correct) {
                        classes += 'correct';
                    } else {
                        classes += 'incorrect';
                    }
                }
                const disabledClass = answered[currentQuestion] ? 'disabled' : '';
                html += `<div class="option ${classes} ${disabledClass}" onclick="${answered[currentQuestion] ? '' : `handleAnswerClick(${i})`}" style="${answered[currentQuestion] ? 'cursor: not-allowed;' : ''}"><span class="option-letter">${letters[i]}</span> ${opt.text}</div>`;
            });

            container.innerHTML = html;

            if (answered[currentQuestion]) {
                showFeedback();
            } else {
                document.getElementById('feedback').innerHTML = '';
                document.getElementById('feedback').classList.remove('show');
            }

            updateProgressBar();
            updateNavigationButtons();
            updateProgressInfo();
        }

        function handleAnswerClick(index) {
            if (answered[currentQuestion]) return;

            answers[currentQuestion] = index;
            answered[currentQuestion] = true;

            showFeedback();
            updateProgressBar();
            updateProgressInfo();
            updateNavigationButtons();
            displayQuestion();
        }

        function showFeedback() {
            const feedbackDiv = document.getElementById('feedback');
            const item = questions[currentQuestion];
            const isCorrect = answers[currentQuestion] === item.correct;
            const selectedOption = item.options[answers[currentQuestion]];

            feedbackDiv.className = 'feedback-container show ' + (isCorrect ? 'feedback-correct' : 'feedback-incorrect');

            let html = '';

            if (isCorrect) {
                html += `
                    <div class="feedback-header">Bonne réponse!</div>
                    <div class="feedback-explanation">${item.correctExplain}</div>
                `;
            } else {
                html += `
                    <div class="feedback-header">Pas tout à fait</div>
                    <div class="feedback-explanation">${selectedOption.explain}</div>
                    <div class="correct-answer-box">
                        <div class="correct-answer-label">✓ Bonne réponse:</div>
                        <div>${item.options[item.correct].text}</div>
                        <div style="margin-top: 8px; font-size: 0.9em;">${item.correctExplain}</div>
                    </div>
                `;
            }

            feedbackDiv.innerHTML = html;
        }

        function updateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            progressBar.innerHTML = '';

            for (let i = 0; i < questions.length; i++) {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';

                if (!answered[i]) {
                    segment.classList.add('unanswered');
                } else if (answers[i] === questions[i].correct) {
                    segment.classList.add('correct');
                } else {
                    segment.classList.add('incorrect');
                }

                progressBar.appendChild(segment);
            }
        }

        function updateNavigationButtons() {
            const isAnswered = answered[currentQuestion];
            document.getElementById('prevBtn').disabled = currentQuestion === 0 || !isAnswered;
            document.getElementById('nextBtn').disabled = !isAnswered;

            if (currentQuestion === questions.length - 1) {
                document.getElementById('nextBtn').textContent = 'Voir Résultat';
            } else {
                document.getElementById('nextBtn').textContent = 'Suivant →';
            }
        }

        function updateProgressInfo() {
            document.getElementById('question-counter').textContent = `Question ${currentQuestion + 1} / ${questions.length}`;

            let correctCount = 0;
            let incorrectCount = 0;

            for (let i = 0; i < answers.length; i++) {
                if (answered[i]) {
                    if (answers[i] === questions[i].correct) {
                        correctCount++;
                    } else {
                        incorrectCount++;
                    }
                }
            }

            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('incorrect-count').textContent = incorrectCount;
        }

        function nextQuestion() {
            if (currentQuestion === questions.length - 1) {
                showFinalResults();
                return;
            }

            currentQuestion++;
            displayQuestion();
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
            }
        }

        function showFinalResults() {
            let score = 0;
            answers.forEach((answer, index) => {
                if (answer === questions[index].correct) score++;
            });

            const container = document.getElementById('quiz-container');
            container.innerHTML = '<div class="question">Quiz terminé!</div>';

            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.className = 'feedback-container';
            feedbackDiv.innerHTML = '';

            let recapHtml = '<div class="recap-title">Résumé de vos réponses</div>';

            questions.forEach((question, index) => {
                const userAnswer = question.options[answers[index]];
                const correctAnswer = question.options[question.correct];
                const isCorrect = answers[index] === question.correct;

                recapHtml += `
                    <div class="recap-card ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="recap-number">Question ${index + 1} / ${questions.length}</div>
                        <div class="recap-question">${question.q}</div>
                        <div class="recap-answer-item user">
                            <span class="recap-label">Votre réponse:</span>
                            ${userAnswer.text}
                            <span class="recap-result ${isCorrect ? 'correct' : 'incorrect'}">
                                ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
                            </span>
                        </div>
                        ${!isCorrect ? `
                            <div class="recap-answer-item correct-answer">
                                <span class="recap-label">Bonne réponse:</span>
                                ${correctAnswer.text}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            document.getElementById('result').innerHTML = `
                <div style="font-size: 2em; margin: 30px 0 20px;">Votre score : ${score} / ${questions.length}</div>
                <div style="font-size: 1.1em; color: #555; margin-bottom: 30px;">Réussite : ${Math.round(score / questions.length * 100)}%</div>
                <div class="recap-container">${recapHtml}</div>
            `;

            document.getElementById('prevBtn').disabled = false;
            document.getElementById('nextBtn').textContent = 'Recommencer';
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').onclick = function() { location.reload(); };
            document.getElementById('prevBtn').onclick = function() {
                currentQuestion = questions.length - 1;
                displayQuestion();
            };
        }

        displayQuestion();
    </script>
</body>
</html>
