<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Quiz - Organisation du travail et gestion des tâches</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="global-course-title">Initiation à la fonction de travail d'un spécialiste en qualité logicielle</div>
    <h1>Quiz : Organisation du travail et gestion des tâches (Cours 5)</h1>

    <div class="progress-container">
        <div class="progress-info">
            <span id="question-counter">Question 1 / 10</span>
            <div class="progress-stats">
                <span class="stat-badge incorrect"><span class="stat-icon">✕</span><span id="incorrect-count">0</span></span>
                <span class="stat-badge correct"><span class="stat-icon">✓</span><span id="correct-count">0</span></span>
            </div>
        </div>
        <div class="progress-bar-wrapper" id="progressBar"></div>
    </div>

    <div id="quiz-container" class="card"></div>

    <div id="feedback" class="feedback-container"></div>

    <div class="quiz-navigation">
        <button id="prevBtn" onclick="previousQuestion()">← Précédent</button>
        <button id="nextBtn" onclick="nextQuestion()">Suivant →</button>
    </div>

    <div id="result"></div>

    <script>
        const questions = [
    {
        "q": "Selon le cours, quelles sont les cinq rubriques d'une fiche de tâche ?",
        "options": [
            {
                "text": "Description, objectifs, ressources, dépendances, contraintes",
                "explain": "Correct. Ce sont les cinq questions à se poser avant de commencer : que faire, comment savoir que c'est réussi, de quoi ai-je besoin, qu'est-ce que j'attends des autres, quelles limites respecter."
            },
            {
                "text": "Analyse, conception, exécution, rapport, bilan",
                "explain": "Faux. Ce sont des étapes d'une activité de test, pas les rubriques qui décrivent une tâche."
            },
            {
                "text": "Must, Should, Could, Won't, Bonus",
                "explain": "Faux. MoSCoW sert à prioriser, et il n'a que quatre catégories."
            },
            {
                "text": "Qui, quoi, où, quand, combien",
                "explain": "Faux. Ces questions sont utiles, mais ce ne sont pas les cinq rubriques présentées au cours."
            }
        ],
        "correct": 0,
        "correctExplain": "Correct. Ce sont les cinq questions à se poser avant de commencer : que faire, comment savoir que c'est réussi, de quoi ai-je besoin, qu'est-ce que j'attends des autres, quelles limites respecter."
    },
    {
        "q": "Lequel de ces objectifs respecte le mieux les critères SMART ?",
        "options": [
            {
                "text": "Bien tester le panier",
                "explain": "Faux. Ni spécifique ni mesurable : comment saurez-vous que c'est « bien » testé ?"
            },
            {
                "text": "Tester le plus de choses possible avant la fin",
                "explain": "Faux. Aucun résultat mesurable, aucune échéance précise."
            },
            {
                "text": "Couvrir les 4 critères d'acceptation de LS-142 avant la revue du 20 novembre",
                "explain": "Correct. Spécifique (LS-142), mesurable (4 critères sur 4), atteignable, pertinent pour la v2.0 et daté (20 novembre)."
            },
            {
                "text": "Trouver toutes les anomalies du panier",
                "explain": "Faux. Irréaliste : aucun test ne garantit de trouver toutes les anomalies."
            }
        ],
        "correct": 2,
        "correctExplain": "Correct. Spécifique (LS-142), mesurable (4 critères sur 4), atteignable, pertinent pour la v2.0 et daté (20 novembre)."
    },
    {
        "q": "Votre compte Xray n'a pas encore été créé et personne n'a prévu de le faire. Dans quel état est cette ressource ?",
        "options": [
            {
                "text": "Disponible",
                "explain": "Faux. Le compte n'existe pas : vous ne pouvez pas l'utiliser."
            },
            {
                "text": "À demander",
                "explain": "Correct. Personne ne le fera à votre place : il faut le demander, à une personne précise, avec une échéance."
            },
            {
                "text": "En attente, avec une date connue",
                "explain": "Faux. Aucune date n'est prévue ; c'est justement pourquoi il faut agir."
            },
            {
                "text": "Inutile pour la tâche",
                "explain": "Faux. Xray sert à rédiger et suivre les cas de test : vous en avez besoin."
            }
        ],
        "correct": 1,
        "correctExplain": "Correct. Personne ne le fera à votre place : il faut le demander, à une personne précise, avec une échéance."
    },
    {
        "q": "Selon le cours, quelle est une bonne demande de ressource ?",
        "options": [
            {
                "text": "« Quelqu'un pourrait-il créer un compte de test ? »",
                "explain": "Faux. Personne n'est désigné, et il manque l'échéance."
            },
            {
                "text": "« J'ai besoin de plein de choses, on en parle ? »",
                "explain": "Faux. On ne sait ni quoi, ni à qui, ni pour quand."
            },
            {
                "text": "« URGENT !!! Compte de test SVP »",
                "explain": "Faux. Le ton est inadapté et la demande ne précise ni la personne ni la date."
            },
            {
                "text": "« Karim, peux-tu me créer un compte membre de test d'ici mardi midi ? Il me faut pour préparer les données du panier. »",
                "explain": "Correct. Une personne précise, une ressource exacte, une échéance et la raison en une phrase."
            }
        ],
        "correct": 3,
        "correctExplain": "Correct. Une personne précise, une ressource exacte, une échéance et la raison en une phrase."
    },
    {
        "q": "L'environnement de test ne sera prêt que mercredi. Quelle étape pouvez-vous faire lundi ?",
        "options": [
            {
                "text": "Exécuter les cas de test",
                "explain": "Faux. L'exécution dépend de l'environnement : elle doit attendre mercredi."
            },
            {
                "text": "Retester le correctif du compteur",
                "explain": "Faux. Le retest demande l'environnement, et le correctif."
            },
            {
                "text": "Rédiger les cas de test et les faire relire",
                "explain": "Correct. La rédaction et la revue ne dépendent pas de l'environnement : elles peuvent avancer en parallèle."
            },
            {
                "text": "Consigner les anomalies trouvées à l'exécution",
                "explain": "Faux. On ne peut consigner que ce qu'on a trouvé en exécutant."
            }
        ],
        "correct": 2,
        "correctExplain": "Correct. La rédaction et la revue ne dépendent pas de l'environnement : elles peuvent avancer en parallèle."
    },
    {
        "q": "Avec MoSCoW, comment classer « Tester le programme de fidélité » si le Product Owner l'a reporté à la v2.1 ?",
        "options": [
            {
                "text": "Won't : pas ce sprint",
                "explain": "Correct. La fonction est reportée consciemment : la tester maintenant gaspillerait du temps."
            },
            {
                "text": "Must : doit être fait",
                "explain": "Faux. Une fonction reportée n'est pas indispensable à la sortie de la v2.0."
            },
            {
                "text": "Should : devrait être fait",
                "explain": "Faux. « Should » désigne ce qui est important mais pas bloquant pour cette version ; ici, la fonction n'est même pas dans la version."
            },
            {
                "text": "Could : pourrait être fait",
                "explain": "Faux. « Could » désigne ce qu'on fait si le temps le permet ; une fonction reportée n'entre pas dans le sprint."
            }
        ],
        "correct": 0,
        "correctExplain": "Correct. La fonction est reportée consciemment : la tester maintenant gaspillerait du temps."
    },
    {
        "q": "Pourquoi l'équipe limite-t-elle à 2 le nombre de cartes « En cours » par personne ?",
        "options": [
            {
                "text": "Pour que le tableau soit plus joli",
                "explain": "Faux. La limite a une raison d'efficacité, pas d'esthétique."
            },
            {
                "text": "Pour terminer avant de commencer et réduire les changements de contexte",
                "explain": "Correct. Moins de tâches ouvertes, c'est moins de temps perdu à passer de l'une à l'autre, et plus de tâches réellement terminées."
            },
            {
                "text": "Parce que Jira ne permet pas d'en afficher plus",
                "explain": "Faux. Les outils permettent d'en afficher autant qu'on veut : la limite est une règle d'équipe."
            },
            {
                "text": "Pour que le superviseur ait moins de cartes à lire",
                "explain": "Faux. La limite sert d'abord à mieux travailler, pas à alléger la lecture."
            }
        ],
        "correct": 1,
        "correctExplain": "Correct. Moins de tâches ouvertes, c'est moins de temps perdu à passer de l'une à l'autre, et plus de tâches réellement terminées."
    },
    {
        "q": "Mardi, à 10 h, l'environnement de test tombe en panne pendant que vous exécutez les tests du panier. Que faites-vous avec la carte ?",
        "options": [
            {
                "text": "Je la laisse « En cours » : je vais bien finir par la terminer",
                "explain": "Faux. Elle occuperait une place d'encours alors que vous ne pouvez pas avancer, et le blocage resterait invisible."
            },
            {
                "text": "Je la remets « À faire » sans rien dire",
                "explain": "Faux. Le travail est commencé, et le blocage doit être signalé."
            },
            {
                "text": "Je la passe à « Fait » pour respecter le plan",
                "explain": "Faux. Le tableau doit refléter la réalité ; une carte non terminée n'est pas « Fait »."
            },
            {
                "text": "Je la déplace dans « Bloqué », je signale la panne et je commence une tâche qui ne dépend pas de l'environnement",
                "explain": "Correct. Le blocage devient visible, l'équipe peut réagir, et vous restez productif."
            }
        ],
        "correct": 3,
        "correctExplain": "Correct. Le blocage devient visible, l'équipe peut réagir, et vous restez productif."
    },
    {
        "q": "Amélie, la cliente, vous écrit directement pour ajouter un test de bannière de Noël au sprint. Quelle est la meilleure réponse ?",
        "options": [
            {
                "text": "Accepter tout de suite pour faire plaisir à la cliente",
                "explain": "Faux. Vous surchargeriez le sprint sans l'accord de l'équipe, au risque de retarder le paiement et le panier."
            },
            {
                "text": "Ignorer le message : ce n'est pas votre rôle",
                "explain": "Faux. Une cliente mérite une réponse courtoise et une suite claire."
            },
            {
                "text": "Remercier, dire que la demande sera étudiée avec le Product Owner, et en parler à Marc-André ou à Julien",
                "explain": "Correct. Vous restez courtois sans rien promettre, et la décision passe par les personnes qui fixent les priorités."
            },
            {
                "text": "Lui répondre que c'est impossible avant la v3.0",
                "explain": "Faux. Vous n'avez pas le pouvoir de décider seul ; c'est au Product Owner de trancher."
            }
        ],
        "correct": 2,
        "correctExplain": "Correct. Vous restez courtois sans rien promettre, et la décision passe par les personnes qui fixent les priorités."
    },
    {
        "q": "Une IA propose ce découpage : « 1. Exécuter les tests (1 h) ; 2. Rédiger 40 cas (30 min) ; 3. Tester le paiement en cryptomonnaie exigé par la norme PCI-QA 2025 ». Quelle analyse est la plus juste ?",
        "options": [
            {
                "text": "Le découpage est utilisable tel quel : l'IA connaît les bonnes pratiques",
                "explain": "Faux. Le cours rappelle que tout livrable de l'IA se teste ; celui-ci contient plusieurs erreurs."
            },
            {
                "text": "Seule la durée de l'étape 2 pose problème",
                "explain": "Faux. L'ordre et l'étape 3 posent aussi problème."
            },
            {
                "text": "Le seul problème est que l'IA a oublié le rapport de test",
                "explain": "Faux. Le rapport manque peut-être, mais les erreurs présentes sont plus graves : ordre, durée et exigence inventée."
            },
            {
                "text": "L'ordre est illogique, la durée de rédaction est irréaliste et l'étape 3 repose sur une exigence inventée",
                "explain": "Correct. On ne peut pas exécuter avant de rédiger ; 40 cas en 30 minutes est irréaliste ; ni la cryptomonnaie ni cette « norme » ne figurent dans les exigences."
            }
        ],
        "correct": 3,
        "correctExplain": "Correct. On ne peut pas exécuter avant de rédiger ; 40 cas en 30 minutes est irréaliste ; ni la cryptomonnaie ni cette « norme » ne figurent dans les exigences."
    }
];
        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let answered = new Array(questions.length).fill(false);

        function displayQuestion() {
            const container = document.getElementById('quiz-container');
            const item = questions[currentQuestion];

            let html = `<div class="question">${currentQuestion + 1}. ${item.q}</div>`;
            const letters = ['A', 'B', 'C', 'D'];
            item.options.forEach((opt, i) => {
                let classes = '';
                if (answers[currentQuestion] === i) {
                    classes = 'selected ';
                    if (i === item.correct) {
                        classes += 'correct';
                    } else {
                        classes += 'incorrect';
                    }
                }
                const disabledClass = answered[currentQuestion] ? 'disabled' : '';
                html += `<div class="option ${classes} ${disabledClass}" onclick="${answered[currentQuestion] ? '' : `handleAnswerClick(${i})`}" style="${answered[currentQuestion] ? 'cursor: not-allowed;' : ''}"><span class="option-letter">${letters[i]}</span> ${opt.text}</div>`;
            });

            container.innerHTML = html;

            if (answered[currentQuestion]) {
                showFeedback();
            } else {
                document.getElementById('feedback').innerHTML = '';
                document.getElementById('feedback').classList.remove('show');
            }

            updateProgressBar();
            updateNavigationButtons();
            updateProgressInfo();
        }

        function handleAnswerClick(index) {
            if (answered[currentQuestion]) return;

            answers[currentQuestion] = index;
            answered[currentQuestion] = true;

            showFeedback();
            updateProgressBar();
            updateProgressInfo();
            updateNavigationButtons();
            displayQuestion();
        }

        function showFeedback() {
            const feedbackDiv = document.getElementById('feedback');
            const item = questions[currentQuestion];
            const isCorrect = answers[currentQuestion] === item.correct;
            const selectedOption = item.options[answers[currentQuestion]];

            feedbackDiv.className = 'feedback-container show ' + (isCorrect ? 'feedback-correct' : 'feedback-incorrect');

            let html = '';

            if (isCorrect) {
                html += `
                    <div class="feedback-header">Bonne réponse!</div>
                    <div class="feedback-explanation">${item.correctExplain}</div>
                `;
            } else {
                html += `
                    <div class="feedback-header">Pas tout à fait</div>
                    <div class="feedback-explanation">${selectedOption.explain}</div>
                    <div class="correct-answer-box">
                        <div class="correct-answer-label">✓ Bonne réponse:</div>
                        <div>${item.options[item.correct].text}</div>
                        <div style="margin-top: 8px; font-size: 0.9em;">${item.correctExplain}</div>
                    </div>
                `;
            }

            feedbackDiv.innerHTML = html;
        }

        function updateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            progressBar.innerHTML = '';

            for (let i = 0; i < questions.length; i++) {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';

                if (!answered[i]) {
                    segment.classList.add('unanswered');
                } else if (answers[i] === questions[i].correct) {
                    segment.classList.add('correct');
                } else {
                    segment.classList.add('incorrect');
                }

                progressBar.appendChild(segment);
            }
        }

        function updateNavigationButtons() {
            const isAnswered = answered[currentQuestion];
            document.getElementById('prevBtn').disabled = currentQuestion === 0 || !isAnswered;
            document.getElementById('nextBtn').disabled = !isAnswered;

            if (currentQuestion === questions.length - 1) {
                document.getElementById('nextBtn').textContent = 'Voir Résultat';
            } else {
                document.getElementById('nextBtn').textContent = 'Suivant →';
            }
        }

        function updateProgressInfo() {
            document.getElementById('question-counter').textContent = `Question ${currentQuestion + 1} / ${questions.length}`;

            let correctCount = 0;
            let incorrectCount = 0;

            for (let i = 0; i < answers.length; i++) {
                if (answered[i]) {
                    if (answers[i] === questions[i].correct) {
                        correctCount++;
                    } else {
                        incorrectCount++;
                    }
                }
            }

            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('incorrect-count').textContent = incorrectCount;
        }

        function nextQuestion() {
            if (currentQuestion === questions.length - 1) {
                showFinalResults();
                return;
            }

            currentQuestion++;
            displayQuestion();
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
            }
        }

        function showFinalResults() {
            let score = 0;
            answers.forEach((answer, index) => {
                if (answer === questions[index].correct) score++;
            });

            const container = document.getElementById('quiz-container');
            container.innerHTML = '<div class="question">Quiz terminé!</div>';

            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.className = 'feedback-container';
            feedbackDiv.innerHTML = '';

            let recapHtml = '<div class="recap-title">Résumé de vos réponses</div>';

            questions.forEach((question, index) => {
                const userAnswer = question.options[answers[index]];
                const correctAnswer = question.options[question.correct];
                const isCorrect = answers[index] === question.correct;

                recapHtml += `
                    <div class="recap-card ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="recap-number">Question ${index + 1} / ${questions.length}</div>
                        <div class="recap-question">${question.q}</div>
                        <div class="recap-answer-item user">
                            <span class="recap-label">Votre réponse:</span>
                            ${userAnswer.text}
                            <span class="recap-result ${isCorrect ? 'correct' : 'incorrect'}">
                                ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
                            </span>
                        </div>
                        ${!isCorrect ? `
                            <div class="recap-answer-item correct-answer">
                                <span class="recap-label">Bonne réponse:</span>
                                ${correctAnswer.text}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            document.getElementById('result').innerHTML = `
                <div style="font-size: 2em; margin: 30px 0 20px;">Votre score : ${score} / ${questions.length}</div>
                <div style="font-size: 1.1em; color: #555; margin-bottom: 30px;">Réussite : ${Math.round(score / questions.length * 100)}%</div>
                <div class="recap-container">${recapHtml}</div>
            `;

            document.getElementById('prevBtn').disabled = false;
            document.getElementById('nextBtn').textContent = 'Recommencer';
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').onclick = function() { location.reload(); };
            document.getElementById('prevBtn').onclick = function() {
                currentQuestion = questions.length - 1;
                displayQuestion();
            };
        }

        displayQuestion();
    </script>
</body>
</html>
